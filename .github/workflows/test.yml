name: Test

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

jobs:
  test:
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Run tests
        run: npm run test
